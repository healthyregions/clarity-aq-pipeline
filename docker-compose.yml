volumes:
  minio_data:

services:
  minio:
    image: minio/minio:latest
    container_name: clarity-minio
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # MinIO Console port
    command: server --console-address ":9001" /data
    env_file:
      - .env
    volumes:
      - minio_data:/data # Persistent storage for MinIO data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3


  minio-ensure-bucket-exists:
    image: minio/mc:latest
    env_file:
      - .env
    network_mode: host
    entrypoint: >
      /bin/sh -c "
      echo creating ${S3_BUCKET_NAME} on ${S3_ENDPOINT_URL}...;
      /usr/bin/mc alias set myminio ${S3_ENDPOINT_URL} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/${S3_BUCKET_NAME};
      exit 0;
      "
    depends_on:
      minio:
        condition: service_healthy


      #/usr/bin/mc policy set public myminio/${S3_BUCKET_NAME};
  minio-ensure-public-download:
    image: minio/mc:latest
    env_file:
      - .env
    network_mode: host
    entrypoint: >
      /bin/sh -c "
      echo setting policy for ${S3_BUCKET_NAME} on ${S3_ENDPOINT_URL}...;
      /usr/bin/mc alias set myminio ${S3_ENDPOINT_URL} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET_NAME};
      exit 0;
      "
    depends_on:
      minio:
        condition: service_healthy
      minio-ensure-bucket-exists:
        condition: service_completed_successfully

  aq:
    image: ghcr.io/healthyregions/clarity-aq-pipeline
    container_name: clarity-aq
    env_file:
      - .env
    build:
      context: .
    network_mode: host
    profiles: ["none"]
    volumes:
      - ./data:/home/rstudio/data/
    command: >
      python ./src/main.py --recent --fetch --clean --merge


