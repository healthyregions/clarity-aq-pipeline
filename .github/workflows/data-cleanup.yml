# This is a basic workflow to help you get started with Actions

name: data-cleanup

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]
  
  #            ┌───────────── minute (0 - 59)
  #            │ ┌───────────── hour (0 - 23)
  #            │ │ ┌───────────── day of the month (1 - 31)
  #            │ │ │ ┌───────────── month (1 - 12)
  #            │ │ │ │ ┌───────────── day of the week (0 - 6)
  #            │ │ │ │ │                                   
  #            │ │ │ │ │
  #            │ │ │ │ │
  #            * * * * *
  schedule:
    # Run once per day at ~ midnight (UTC)
    - cron: "0 0 * * *"
    
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Copy default envvar parameters for base config
      - name: Create base parameters
        run: cp .env.example .env

      # Fetch Clarity API data and save raw files locally
      - name: Build + run clarityfetch image (Fetch Clarity API data and save as CSV)
        run: docker compose run --remove-orphans -e CLARITY_API_KEY=${{ secrets.CLARITY_API_TOKEN }} -e S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }} -e S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }} --build clarityfetch


      # Currently saved as intermediary CSV within container: /usr/app/raw.csv
      # Run data cleanup, QA/QI, postprocessing, etc to produce /usr/app/cleaned.csv
      # TODO: decide which metrics are important to preserve/display - UIC to produce these R scripts
      # TODO: Run secondary container for R script(s), mount/read /usr/app/raw.csv
      # TODO: Alternatively, run Rscript from Python (instead of secondary image?)
      #- name: Build datacleanup image (R? Run data cleanup / postprocessing on Clarity CSV data)
      #  run: docker compose run --build datacleanup


      # Upload cleaned output files to S3
      - name: Build + run s3push image (Upload cleaned output files to S3)
        run: docker compose run --remove-orphans -e CLARITY_API_KEY=${{ secrets.CLARITY_API_TOKEN }} -e S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }} -e S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }} s3push

      # TODO: push image to NCSA Harbor / GHCR.io / Docker Hub before deleting?

      - name: Delete clarityfetch + datacleanup images
        run: docker rmi -f clarityfetch  # datacleanup

