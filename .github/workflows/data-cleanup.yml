# This workflow will fetch air quality sensor data from the Clarity REST API v2,
# run cleanup operations on this data, and then push it into an S3 bucket

name: data-cleanup

# Controls when the workflow will run
on:
  #            ┌───────────── minute (0 - 59)
  #            │ ┌───────────── hour (0 - 23)
  #            │ │ ┌───────────── day of the month (1 - 31)
  #            │ │ │ ┌───────────── month (1 - 12)
  #            │ │ │ │ ┌───────────── day of the week (0 - 6)
  #            │ │ │ │ │                                   
  #            │ │ │ │ │
  #            │ │ │ │ │
  #            * * * * *
  schedule:
    # Run once per hour at ~ 5 minutes after the hour
    - cron: "5 * * * *"
    
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "pipeline"
  # This allows us to share storage between the different stages of the pipeline
  pipeline:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so our job can access it
      - uses: actions/checkout@v4

      # Login to GHCR.io to pull our pre-built Docker image
      - name: Log in to GHCR.io
        uses: docker/login-action@v3
        with:
          # Authenticate using the built-in GITHUB_TOKEN
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copy default envvar parameters for base config
      - name: Create base parameters
        run: cp .env.example .env


      # Fetch Clarity API data and save raw files locally
      - name: Fetch Clarity sensor data and save as CSV
        run: docker compose run --remove-orphans -e CLARITY_API_KEY=${{ secrets.CLARITY_API_TOKEN }} -e S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }} -e S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }} clarityfetch


      # Run data cleanup, QA/QI, postprocessing, etc to produce /usr/app/cleaned.csv
      # Currently saved as intermediary CSV within container: /usr/app/raw.csv
      # TODO: decide which metrics are important to preserve/display - UIC to produce these R scripts
      # TODO: Run secondary container for R script(s), mount/read /usr/app/raw.csv
      # TODO: Alternatively, run Rscript from Python (instead of secondary image?)
      #- name: Build datacleanup image (R? Run data cleanup / postprocessing on Clarity CSV data)
      #  run: docker compose run --build datacleanup


      # Upload cleaned output files to S3
      - name: Build + run s3push image (Upload cleaned output files to S3)
        run: docker compose run --remove-orphans -e CLARITY_API_KEY=${{ secrets.CLARITY_API_TOKEN }} -e S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }} -e S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }} s3push

      - name: Delete clarityfetch + datacleanup images
        run: docker rmi -f clarityfetch  # datacleanup

