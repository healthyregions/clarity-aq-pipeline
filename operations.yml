
# Key here determines output_dataset_name: {metric}.parquet.brotli

mean_pm25:
  outputFrequency: minute
  metricSelect: 'only :pm25 + :internal'
  minObsPerHour: '3'
  qc: true
  cleaningScript: ./scripts/pm25_qa_qc.R
  postprocessing:
    renameColumns:
      #"pm2_5ConcMassIndividual.value": 'mean_pm25'
      #"pm2_5ConcMassIndividual": 'mean_pm25'
      time: 'date'
      n_obs: 'n_valid'
      is_valid: 'is_valid'
      hour: 'date'
      mean_pm25: 'mean_pm25'
      n_valid_hours: 'n_valid'
      is_valid_day: 'is_valid'
      date: 'date'
      daily_mean_pm25: 'mean_pm25'
      n_valid_days: 'n_valid'
      is_valid_week: 'is_valid'
      week: 'date'
      weekly_mean_pm25: 'mean_pm25'
      is_valid_month: 'is_valid'
      month: 'date'
      monthly_mean_pm25: 'mean_pm25'
      is_valid_season: 'is_valid'
      season: 'date'
      seasonal_mean_pm25: 'mean_pm25'
      is_valid_year: 'is_valid'
      year: 'date'
      yearly_mean_pm25: 'mean_pm25'


clarity_pm25:
  outputFrequency: hour
  metricSelect: 'only :pm25'
  cleaningScript: ./scripts/clarity_qa_qc.R
  colName: 'pm2_5ConcMass1HourMean.value'
  postprocessing:
    renameColumns:
      outputFrequency: 'type'
      endOfPeriod: 'date'
      #"pm2_5ConcMassNowcast.value": 'clarity_pm25'
      #"pm2_5ConcMassNowcast": 'clarity_pm25'
      #"pm2_5ConcMass1HourMean.value": 'clarity_pm25'
      #"pm2_5ConcMass1HourMean": 'clarity_pm25'


clarity_no2:
  outputFrequency: hour
  metricSelect: 'only :no2'
  cleaningScript: ./scripts/clarity_qa_qc.R
  colName: 'no2Conc1HourMean.value'
  postprocessing:
    renameColumns:
      outputFrequency: 'type'
      endOfPeriod: 'date'
      #"no2Conc1HourMean.value": 'clarity_no2'
      #"no2Conc1HourMean": 'clarity_no2'
      #"no2Conc1HourMeanUsEpaAqi.value": 'clarity_no2'
      #"no2Conc1HourMeanUsEpaAqi": 'clarity_no2'


nowcast_aqi:
  outputFrequency: hour
  metricSelect: 'only *nowcast*'
  cleaningScript: ./scripts/clarity_qa_qc.R
  colName: 'pm2_5ConcMassNowcastUsEpaAqi.value'
  postprocessing:
    renameColumns:
      outputFrequency: 'type'
      endOfPeriod: 'date'
      #'pm2_5ConcMassNowcastUsEpaAqi.value': 'nowcast_aqi'
      #'pm2_5ConcMassNowcastUsEpaAqi': 'nowcast_aqi'


